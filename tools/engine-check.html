<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RICOCHET engine check</title>
<!--
  Does the physics produce the same numbers in THIS browser's engine?

  The leaderboard compares a score made on an iPhone (JavaScriptCore) with one
  made on an Android (V8) and with the Worker's replay (V8). If any engine
  rounds differently, honest players get called cheats and the board is junk.
  tests/golden.test.mjs proves this under Node only. Open this page in Safari,
  in Chrome, and on the phone itself to prove it everywhere else.

  Serve it from the repo root: python3 -m http.server 8099 --bind 127.0.0.1
  then open http://127.0.0.1:8099/tools/engine-check.html
-->
<style>
  body { background:#0a0f1a; color:#dbe6f5; font:16px/1.5 -apple-system,system-ui,sans-serif;
         margin:0; padding:28px; }
  h1 { font-size:18px; letter-spacing:.14em; text-transform:uppercase; color:#8fb2e0; margin:0 0 18px; }
  #verdict { font-size:40px; font-weight:800; letter-spacing:.04em; margin:18px 0; }
  .pass { color:#49e08b; } .fail { color:#ff6b6b; } .busy { color:#8fb2e0; }
  table { border-collapse:collapse; margin-top:14px; font-size:14px; }
  td { padding:3px 14px 3px 0; color:#9fb3cc; } td.v { color:#dbe6f5; font-variant-numeric:tabular-nums; }
  pre { color:#ff9a9a; font-size:13px; white-space:pre-wrap; }
</style>
</head>
<body>
<h1>Ricochet · engine check</h1>
<div id="verdict" class="busy">running…</div>
<table id="facts"></table>
<pre id="drift"></pre>

<script type="module">
import { generateArena, runMatch, makePRNG } from '../shared/sim.js';

// FNV-1a, byte-identical to tests/golden.test.mjs
function hash(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return h.toString(16).padStart(8, '0');
}

// Same construction as tests/golden.test.mjs build(); keep the two in step.
function build() {
  const rng = makePRNG(20261022);
  const out = [];
  for (let i = 0; i < 150; i++) {
    const seed = rng.next() | 0;
    const lv = i % 7;
    const shots = [];
    for (let s = 0; s < 5; s++) {
      shots.push({
        dx: rng.i(-10000, 10000), dy: rng.i(-10000, -200), p: rng.i(0, 1000),
        nf: rng.i(0, 2) === 0 ? rng.i(48, 1200) : -1,
        ndx: rng.i(-10000, 10000), ndy: rng.i(-10000, 10000),
      });
    }
    const r = runMatch(seed, lv, shots);
    const a = generateArena(seed, lv);
    out.push({ seed, lv, arena: hash(JSON.stringify(a)), run: hash(JSON.stringify(r)), score: r.score });
  }
  return out;
}

const el = (id) => document.getElementById(id);
const row = (k, v) => {
  const tr = document.createElement('tr');
  const a = document.createElement('td'); a.textContent = k;
  const b = document.createElement('td'); b.className = 'v'; b.textContent = v;
  tr.append(a, b); el('facts').append(tr);
};

try {
  const golden = await (await fetch('../tests/golden.json', { cache: 'no-store' })).json();
  const t0 = performance.now();
  const fresh = build();
  const ms = performance.now() - t0;

  const bad = [];
  for (let i = 0; i < golden.length; i++) {
    const a = golden[i], b = fresh[i];
    if (!b || a.arena !== b.arena || a.run !== b.run || a.score !== b.score) {
      bad.push(`seed ${a.seed} lv${a.lv}: score ${a.score} -> ${b ? b.score : 'missing'}` +
        (b && a.arena !== b.arena ? '  [arena differs]' : '') +
        (b && a.run !== b.run && a.arena === b.arena ? '  [physics differs]' : ''));
    }
  }

  el('verdict').textContent = bad.length
    ? `DIFFERENT — ${bad.length}/${golden.length} runs drift`
    : `IDENTICAL — ${golden.length}/${golden.length} runs`;
  el('verdict').className = bad.length ? 'fail' : 'pass';
  row('engine', navigator.userAgent.slice(0, 96));
  row('runs replayed', golden.length);
  row('total score', fresh.reduce((s, r) => s + r.score, 0));
  row('replay time', ms.toFixed(0) + ' ms  (' + (ms / golden.length).toFixed(2) + ' ms per run)');
  el('drift').textContent = bad.slice(0, 8).join('\n');
  document.title = (bad.length ? 'DIFFERENT ' : 'IDENTICAL ') + document.title;
} catch (e) {
  el('verdict').textContent = 'ERROR';
  el('verdict').className = 'fail';
  el('drift').textContent = String(e && e.stack || e);
}
</script>
</body>
</html>
